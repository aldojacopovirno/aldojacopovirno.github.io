---
layout: default
---

<div class="post">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-date">{{ page.date | date: "%B %-d, %Y" }}</p>

    {% if page.cover_image %}
    <div class="post-cover-image">
        <img src="{{ page.cover_image }}" alt="{{ page.title }}">
    </div>
    {% if page.cover_image_author %}
    <p class="post-cover-caption">{{ page.cover_image_author }}</p>
    {% endif %}
    {% endif %}

    <div class="post-content">
        {{ content }}
    </div>

    <hr>

    <div class="post-navigation">
        <a href="{{ site.baseurl }}/blog" class="back-to-blog">← Back to Blog</a>
    </div>
</div>
